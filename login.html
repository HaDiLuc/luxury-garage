<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Đăng Nhập - Luxury Garage</title>
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <!-- Header -->
  <header class="main-header">
    <a href="index.html" class="logo-link">
      <img src="images/logo3.png" alt="Luxury Garage Logo" class="logo-image">
    </a>
    <nav class="main-nav">
      <ul>
        <li><a href="index.html">Trang Chủ</a></li>
        <li><a href="gioithieu.html">Giới Thiệu</a></li>
        <li><a href="cars.html">Sản Phẩm</a></li>
        <li><a href="news.html">Tin Tức</a></li>
        <li><a href="lienhe.html">Liên Hệ</a></li>
      </ul>
    </nav>
   
    <div class="user-actions">
      <a href="search-results.html" title="Tìm Kiếm"><i class="fas fa-search"></i></a>
      
      <!-- Giao diện khi chưa đăng nhập -->
      <a href="login.html" title="Đăng Nhập" class="active"><i class="fas fa-user"></i></a>
      
      <a href="giohang.html" title="Giỏ Hàng"><i class="fas fa-shopping-cart"></i></a>
    </div>
   
  </header>

  <!-- Page Header -->
  <section class="page-header">
    <h1>ĐĂNG NHẬP</h1>
    <p>Chào mừng bạn trở lại, khám phá thế giới siêu xe!</p>
  </section>

  <!-- Nội dung Form Đăng Nhập -->
  <section class="login-container content-section">
    <form action="login" method="POST" class="auth-form" id="loginForm">
      <h2 style="text-align: center; color: var(--primary-red);">Đăng Nhập</h2>
      
      <div class="form-group">
        <label for="username">Tài khoản (Email)</label>
        <div class="input-with-icon">
          <i class="fas fa-user"></i>
          <input type="text" id="username" name="username" placeholder="Nhập email" required>
        </div>
      </div>
      
      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <div class="input-with-icon">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
        </div>
      </div>
      
      <div class="form-options">
         <a href="forgot-password.html" class="forgot-password">Quên mật khẩu?</a>
      </div>
      
      <button type="submit" class="btn-primary">Đăng Nhập</button>
      
      <div class="form-links">
        <p>Chưa có tài khoản? <a href="register.html">Đăng ký</a></p>
      </div>
    </form>
  </section>

  <footer>
    <p>&copy; 2025 Luxury Garage. Phát triển bởi Nhóm 5.</p>
  </footer>
  
  <!-- Script thông báo đăng ký thành công -->
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      if (params.get('registered') === '1') {
        alert('Đăng ký tài khoản thành công! Hãy đăng nhập để tiếp tục.');
        params.delete('registered');
        const url = window.location.pathname + (params.toString()?('?'+params.toString()):'');
        window.history.replaceState({}, document.title, url);
      }
    })();
  </script>
</body>
</html>
